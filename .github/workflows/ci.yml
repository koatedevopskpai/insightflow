name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow a manual training run without any code change.
  workflow_dispatch:
    inputs:
      run_training:
        description: "Run the Optuna training job"
        type: boolean
        default: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.14.0
      - run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  data-change:
    name: Detect data changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            data:
              - '*.csv.dvc'
              - 'prepare_data.py'
              - 'optimize.py'
              - 'model.py'

  train:
    name: Train (Optuna sweep)
    needs: data-change
    if: |
      needs.data-change.outputs.changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pull data from DVC remote
        run: dvc pull
      - name: Run Optuna sweep
        run: python optimize.py --n-trials 10 --min-rmse 1.0
      - name: Upload MLflow store
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store
          path: |
            mlruns/
            mlflow.db
